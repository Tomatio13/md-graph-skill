[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-graphrag-skill"
version = "0.1.0"
description = "Standalone Agent Skill bundle for Markdown-focused GraphRAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "lightrag-hku==1.4.9.11",
    "anthropic==0.77.1",
    "openai==1.106.1",
    "google-genai==1.33.0",
    "torch==2.10.0",
    "numpy==2.4.2",
    "tokenizers==0.22.2",
    "sentence-transformers==5.2.2",
    "faiss-cpu==1.12.0",
    "transformers==5.0.0",
    "python-dotenv==1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["repo_graphrag"]
include = [
    "repo_graphrag/**/*",
]
